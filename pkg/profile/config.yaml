model:
  default: glm-5.3-flash
  provider: litellm
providers:
  litellm:
    name: LiteLLM
    base_url: http://127.0.0.1:4000/v1
    key_env: LITELLM_API_KEY
    transport: openai_chat
    discover_models: false
agent:
  reasoning_effort: low
terminal:
  backend: local
  cwd: /home/jsondarula/Liv-Home
memory:
  memory_enabled: false
  user_profile_enabled: false
onboarding:
  seen:
    tool_progress_prompt: true
    openclaw_residue_cleanup: true
    busy_input_prompt: true
_config_version: 49
platform_toolsets:
  cli:
    - code_execution
    - connections
    - file
    - skills
    - terminal
    - todo
    - web
known_plugin_toolsets:
  cli:
    - a2a
    - spotify
known_builtin_toolsets:
  cli:
    - browser
    - clarify
    - code_execution
    - computer_use
    - connections
    - context_engine
    - cronjob
    - delegation
    - discord
    - discord_admin
    - file
    - homeassistant
    - image_gen
    - memory
    - session_search
    - skills
    - spotify
    - stt
    - terminal
    - todo
    - tts
    - video
    - video_gen
    - vision
    - web
    - x_search
    - yuanbao
